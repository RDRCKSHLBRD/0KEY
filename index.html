<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>>KEY< | Typing Practice Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container" class="theme-blue">
        <header>
            <div class="logo">&gt;KEY&lt;</div>
            <div class="score-container">
                Score: <span id="score">0</span>
            </div>
        </header>

        <div id="game-screen">
            <div id="game-letters"></div>
            <div id="start-screen">
                <h1>&gt;KEY&lt;</h1>
                <p>Type the falling letters before they reach the bottom!</p>
                <div class="settings">
                    <div class="setting">
                        <label for="difficulty">Difficulty:</label>
                        <select id="difficulty">
                            <option value="easy">Easy</option>
                            <option value="medium" selected>Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                    <div class="setting">
                        <label for="theme">Theme:</label>
                        <select id="theme">
                            <option value="blue">Blue</option>
                            <option value="green">Green</option>
                            <option value="red">Red</option>
                            <option value="greyscale">Greyscale</option>
                            <option value="earth">Earth</option>
                            <option value="purple">Purple</option>
                            <option value="orange">Orange</option>
                            <option value="teal">Teal</option>
                            <option value="rose">Rose</option>
                            <option value="midnight">Midnight</option>
                            <option value="primary-combo">Primary Color Combo</option>
                            <option value="nature-combo">Nature Combo</option>
                            <option value="sunset-combo">Sunset Combo</option>
                            <option value="neon-combo">Neon Combo</option>
                            <option value="pastel-combo">Pastel Combo</option>
                            <option value="mono-blue-combo">Monochrome Blue</option>
                            <option value="auto">Auto-Rotate</option>
                        </select>
                    </div>
                </div>
                <button id="start-button">Start Game</button>
            </div>
            <div id="game-over" class="hidden">
                <h2>Game Over</h2>
                <p>Your score: <span id="final-score">0</span></p>
                <p class="game-stats">You missed <span id="missed-letters">0</span> letters</p>
                <div class="color-palette-wrapper">
                    <div class="color-palette-header">Try a different color palette next time:</div>
                    <div class="color-palette">
                        <div class="palette-swatch theme-blue" data-theme="blue"></div>
                        <div class="palette-swatch theme-green" data-theme="green"></div>
                        <div class="palette-swatch theme-red" data-theme="red"></div>
                        <div class="palette-swatch theme-greyscale" data-theme="greyscale"></div>
                        <div class="palette-swatch theme-earth" data-theme="earth"></div>
                        <div class="palette-swatch theme-purple" data-theme="purple"></div>
                        <div class="palette-swatch theme-orange" data-theme="orange"></div>
                        <div class="palette-swatch theme-teal" data-theme="teal"></div>
                        <div class="palette-swatch theme-rose" data-theme="rose"></div>
                        <div class="palette-swatch theme-midnight" data-theme="midnight"></div>
                        <div class="palette-swatch theme-primary-combo" data-theme="primary-combo"></div>
                        <div class="palette-swatch theme-nature-combo" data-theme="nature-combo"></div>
                        <div class="palette-swatch theme-sunset-combo" data-theme="sunset-combo"></div>
                        <div class="palette-swatch theme-neon-combo" data-theme="neon-combo"></div>
                        <div class="palette-swatch theme-pastel-combo" data-theme="pastel-combo"></div>
                        <div class="palette-swatch theme-mono-blue-combo" data-theme="mono-blue-combo"></div>
                    </div>
                </div>
                <button id="restart-button">Play Again</button>
            </div>
        </div>

        <footer>
            <p>A minimalist typing practice game &middot; 2025</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
